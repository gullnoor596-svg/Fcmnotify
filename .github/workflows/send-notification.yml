name: Send FCM Notification

on:
  push:
    paths:
      - "update.json"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send FCM notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m pip install --quiet google-auth requests

          python <<'PY'
          import json
          import os
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          PROJECT_ID = "ffbio-b7686a36"
          TOPIC = "updates"

          with open("update.json", "r", encoding="utf-8") as f:
              update = json.load(f)

          title = str(update["title"])
          message = str(update["message"])
          version = str(update["version"])

          service_account_info = json.loads(
              os.environ["FIREBASE_SERVICE_ACCOUNT"]
          )

          credentials = service_account.Credentials.from_service_account_info(
              service_account_info,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )

          credentials.refresh(Request())

          url = (
              f"https://fcm.googleapis.com/v1/projects/"
              f"{PROJECT_ID}/messages:send"
          )

          payload = {
              "message": {
                  "topic": TOPIC,
                  "notification": {
                      "title": title,
                      "body": message
                  },
                  "data": {
                      "version": version
                  }
              }
          }

          response = requests.post(
              url,
              headers={
                  "Authorization": f"Bearer {credentials.token}",
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=30
          )

          print("FCM status:", response.status_code)
          print(response.text)

          response.raise_for_status()
          print(f"Notification sent for version {version}")
          PY
