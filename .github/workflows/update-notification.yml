name: Send FCM Update Notification

on:
  push:
    branches:
      - main
    paths:
      - "update.json"

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Check update.json
        run: |
          echo "Checking update.json..."
          test -f update.json
          node -e "const u=require('./update.json'); console.log('Version:', u.version); console.log('Title:', u.title); console.log('Message:', u.message);"

      - name: Send FCM notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'EOF'
          const admin = require("firebase-admin");
          const fs = require("fs");

          if (!process.env.FIREBASE_SERVICE_ACCOUNT) {
            throw new Error("FIREBASE_SERVICE_ACCOUNT secret is missing");
          }

          const update = JSON.parse(
            fs.readFileSync("update.json", "utf8")
          );

          if (!update.title || !update.message) {
            throw new Error(
              "update.json must contain title and message"
            );
          }

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          if (!serviceAccount.project_id) {
            throw new Error(
              "Service account JSON does not contain project_id"
            );
          }

          console.log(
            "Firebase project:",
            serviceAccount.project_id
          );

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          async function sendNotification() {
            const message = {
              topic: "updates",

              notification: {
                title: String(update.title),
                body: String(update.message)
              },

              data: {
                version: String(update.version ?? "")
              }
            };

            const response =
              await admin.messaging().send(message);

            console.log(
              "FCM notification sent successfully."
            );

            console.log(
              "Message ID:",
              response
            );
          }

          sendNotification().catch((error) => {
            console.error(
              "FCM ERROR:",
              error.code || "UNKNOWN"
            );

            console.error(
              error.message
            );

            process.exit(1);
          });
          EOF
