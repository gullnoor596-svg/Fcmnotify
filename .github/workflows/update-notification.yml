name: Send FCM Update Notification

on:
  push:
    branches:
      - main
    paths:
      - "update.json"

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Send FCM notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'EOF'
          const admin = require("firebase-admin");
          const fs = require("fs");

          const update = JSON.parse(
            fs.readFileSync("update.json", "utf8")
          );

          if (!update.title || !update.message) {
            throw new Error("update.json must contain title and message");
          }

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          async function sendNotification() {
            const message = {
              topic: "updates",

              notification: {
                title: String(update.title),
                body: String(update.message)
              },

              data: {
                version: String(update.version ?? "")
              }
            };

            const response = await admin.messaging().send(message);

            console.log("FCM notification sent successfully.");
            console.log("Message ID:", response);
          }

          sendNotification().catch((error) => {
            console.error("FCM ERROR:", error.message);
            process.exit(1);
          });
          EOF
